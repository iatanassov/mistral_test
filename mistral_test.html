<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle Size Controller</title>
    <style>
        body {
            background-color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
        }
        .slider-container {
            margin: 20px 0;
        }
        input[type="range"] {
            width: 300px;
        }
        .value-display {
            font-size: 18px;
            margin: 10px 0;
        }
        svg {
            margin: 20px 0;
        }
        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Circle Size Controller</h1>
        <div class="slider-container">
            <input type="range" id="sizeSlider" min="10" max="200" value="100">
        </div>
        <div class="value-display">
            Radius: <span id="radiusValue">100</span>px
        </div>
        <svg width="400" height="400" viewBox="0 0 400 400">
            <circle id="circle" cx="200" cy="200" r="100" fill="rgba(0, 100, 255, 0.5)" stroke="rgba(0, 100, 255, 1)" stroke-width="4" />
        </svg>
        <div class="tooltip" id="tooltip"></div>
    </div>

    <script>
        const slider = document.getElementById('sizeSlider');
        const circle = document.getElementById('circle');
        const radiusValue = document.getElementById('radiusValue');
        const tooltip = document.getElementById('tooltip');

        slider.addEventListener('input', function() {
            const radius = parseInt(this.value);
            circle.setAttribute('r', radius);
            radiusValue.textContent = radius;
        });

        circle.addEventListener('mousemove', function(e) {
            const radius = parseInt(circle.getAttribute('r'));
            const area = (Math.PI * radius * radius).toFixed(2);
            const circumference = (2 * Math.PI * radius).toFixed(2);

            tooltip.innerHTML = `Radius: ${radius}px<br>Area: ${area}px²<br>Circumference: ${circumference}px`;
            tooltip.style.opacity = '1';
            tooltip.style.left = (e.pageX + 10) + 'px';
            tooltip.style.top = (e.pageY + 10) + 'px';
        });

        circle.addEventListener('mouseout', function() {
            tooltip.style.opacity = '0';
        });
    </script>
</body>
</html>
